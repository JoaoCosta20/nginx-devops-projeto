name: CI/CD Pipeline

on:
  push:
    branches: [ "dev-joao" ]

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Limpeza Docker antes do build
        shell: powershell
        run: |
          $containers = docker ps -aq
          if ($containers) {
            docker rm -f $containers
          }
          docker system prune -af --volumes

      - name: Limpar  Docker
        run: docker system prune -af

      - name: Build da imagem Docker
        run: docker build -t nginx-devops-projeto .

      - name: Login no DockerHub
        run: docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"

      - name: Push para DockerHub
        run: |
          docker tag nginx-devops-projeto ${{ secrets.DOCKER_USERNAME }}/nginx-devops-projeto:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/nginx-devops-projeto:latest

      - name: Deploy no Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/servicemonitor.yaml