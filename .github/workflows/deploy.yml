name: CI/CD Pipeline

on:
  push:
    branches: [ "dev-joao" ]

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:

      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Limpeza do Docker antes do build
        shell: powershell
        run: |
          $containers = docker ps -aq
          if ($containers) {
            docker rm -f $containers
          }
          docker system prune -af --volumes

      - name: Build da imagem Docker
        run: docker build -t nginx-devops-projeto .

      - name: Criar container
        shell: powershell
        run: |
          docker run -d -p 8080:80 --name nginx-devops-container nginx-devops-projeto

      - name: Login no Docker Hub
        run: docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"
 
      - name: Push para DockerHub
        run: |
          docker tag nginx-devops-projeto ${{ secrets.DOCKER_USERNAME }}/nginx-devops-projeto:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/nginx-devops-projeto:latest

      - name: Deploy no Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/servicemonitor.yaml

    
      - name: Verificar rollout do Deployment
        run: kubectl rollout status deployment/nginx-devops
