name: CI/CD Pipeline

on:
  push:
    branches: [ "dev-joao" ]

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Build da imagem Docker
        run: docker build -t nginx-devops-projeto .

      - name: Login no DockerHub
        run: docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"

      - name: Push para DockerHub
        run: |
          docker tag java-sample-is ${{ secrets.DOCKER_USERNAME }}/nginx-devops-projeto:latest
          docker push ${{ secrets.DOCKER_PASSWORD }}/nginx-devops-projeto:latest

